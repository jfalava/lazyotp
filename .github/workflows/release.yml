name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            outfile: dist/lazyotp
            archive: dist/lazyotp-linux-x64.zip
            artifact_name: lazyotp-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            outfile: dist/lazyotp
            archive: dist/lazyotp-linux-arm64.zip
            artifact_name: lazyotp-linux-arm64
          - os: macos-latest
            target: bun-darwin-arm64
            outfile: dist/lazyotp
            archive: dist/lazyotp-darwin-arm64.zip
            artifact_name: lazyotp-darwin-arm64
          - os: windows-latest
            target: bun-windows-x64
            outfile: dist/lazyotp.exe
            archive: dist/lazyotp-windows-x64.zip
            artifact_name: lazyotp-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Inject version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"${TAG}\"/" package.json
          rm -f package.json.bak

      - name: Build target
        run: bun build --compile --target=${{ matrix.target }} index.ts --outfile ${{ matrix.outfile }}

      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail
          archive_dir="$(dirname "${{ matrix.archive }}")"
          archive_file="$(basename "${{ matrix.archive }}")"
          binary_file="$(basename "${{ matrix.outfile }}")"
          cd "$archive_dir"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a -tzip "$archive_file" "$binary_file"
          else
            zip "$archive_file" "$binary_file"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lazyotp-*
          merge-multiple: true
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
